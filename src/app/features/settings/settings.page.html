<section class="settings">
  <h2>Configuracoes</h2>

  <p-card header="Preferencias">
    <div class="grid">
      <label for="settingsLocale">Locale</label>
      <select id="settingsLocale" [(ngModel)]="model.locale">
        <option value="pt-BR">pt-BR</option>
        <option value="en-US">en-US</option>
      </select>

      <label for="settingsCurrency">Moeda</label>
      <select id="settingsCurrency" [(ngModel)]="model.currency">
        <option value="BRL">BRL</option>
        <option value="USD">USD</option>
      </select>

      <label for="settingsDarkMode">Dark mode</label>
      <p-toggleswitch inputId="settingsDarkMode" [(ngModel)]="model.darkMode"></p-toggleswitch>

      <p-button label="Salvar" icon="pi pi-check" (onClick)="save()"></p-button>
    </div>
  </p-card>

  <p-card header="Offline first">
    <p>Status da conexao: <strong>{{ sync.isOnline() ? 'Online' : 'Offline' }}</strong></p>
    <p>Status da sincronizacao: <strong>{{ sync.syncing() ? 'Sincronizando' : 'Parado' }}</strong></p>
    <p-button label="Sincronizar agora" icon="pi pi-refresh" (onClick)="syncNow()"></p-button>
  </p-card>
</section>
