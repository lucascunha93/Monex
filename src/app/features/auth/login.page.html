<div class="login-wrapper">
  <div class="login-card">
    <div class="brand">
      <span class="logo-icon">💰</span>
      <h1>Monex</h1>
    </div>

    <h2>{{ mode() === 'login' ? 'Entrar' : 'Criar conta' }}</h2>

    @if (mode() === 'register') {
      <div class="field">
        <label for="loginName">Nome</label>
        <input
          pInputText
          id="loginName"
          data-cy="register-name"
          [(ngModel)]="name"
          placeholder="Seu nome"
          type="text"
          autocomplete="name"
        />
      </div>
    }

    <div class="field">
      <label for="loginEmail">E-mail</label>
      <input
        pInputText
        id="loginEmail"
        data-cy="login-email"
        [(ngModel)]="email"
        placeholder="voce@email.com"
        type="email"
        autocomplete="email"
        class="w-full"
      />
    </div>

    <div class="field">
      <label for="loginPassword">Senha</label>
      <p-password
        inputId="loginPassword"
        data-cy="login-password"
        [(ngModel)]="password"
        placeholder="••••••••"
        [toggleMask]="true"
        [feedback]="mode() === 'register'"
      ></p-password>
    </div>

    @if (errorMessage()) {
      <p class="error-msg" data-cy="login-error">{{ errorMessage() }}</p>
    }

    <p-button
      [label]="mode() === 'login' ? 'Entrar' : 'Criar conta'"
      [loading]="loading()"
      data-cy="login-submit"
      (onClick)="submit()"
    ></p-button>

    <p class="toggle-mode">
      {{ mode() === 'login' ? 'Não tem conta?' : 'Já tem conta?' }}
      <button type="button" class="link-btn" (click)="toggleMode()">
        {{ mode() === 'login' ? 'Criar conta' : 'Entrar' }}
      </button>
    </p>
  </div>
</div>
