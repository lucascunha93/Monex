<section class="accounts">
  <h2>Contas e cartoes</h2>

  <p-card header="Nova conta">
    <div class="form-grid">
      <input
        pInputText
        [(ngModel)]="draft.name"
        placeholder="Nome da conta"
      />

      <select
        [(ngModel)]="draft.type"
      >
        <option value="checking">Banco</option>
        <option value="cash">Dinheiro</option>
        <option value="credit">Cartao de credito</option>
      </select>

      <p-inputNumber
        mode="currency"
        currency="BRL"
        locale="pt-BR"
        [(ngModel)]="draft.openingBalance"
      ></p-inputNumber>

      @if (draft.type === 'credit') {
        <p-inputNumber
          mode="currency"
          currency="BRL"
          locale="pt-BR"
          [(ngModel)]="draft.creditLimit"
        ></p-inputNumber>
      }

      <p-button label="Salvar conta" icon="pi pi-check" (onClick)="save()"></p-button>
    </div>
  </p-card>

  <p-card header="Contas cadastradas">
    <p-table [value]="store.accounts()" [tableStyle]="{ 'min-width': '30rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">Tipo</th>
          <th scope="col">Saldo inicial</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-account>
        <tr>
          <td>{{ account.name }}</td>
          <td>{{ account.type }}</td>
          <td>{{ account.openingBalance | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR' }}</td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</section>
