<div class="shell-bg"></div>

<div class="shell">
  <aside class="shell__sidebar">
    <div class="brand">
      <div class="brand__icon">
        <i class="pi pi-chart-line"></i>
      </div>
      <div>
        <h1 class="brand__name">Monex</h1>
        <p class="brand__sub">Finance OS</p>
      </div>
    </div>

    <nav class="nav">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" class="nav__item">
          <span class="nav__icon"><i [class]="item.icon"></i></span>
          <span class="nav__label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <div class="status-dot" [class.status-dot--online]="sync.isOnline()" [class.status-dot--syncing]="sync.syncing()">
        <span class="status-dot__circle"></span>
        <span>{{ statusLabel() }}</span>
      </div>

      <div class="user-info">
        <div class="user-avatar" [title]="currentUserName()">
          {{ currentUserInitial() }}
        </div>
        <span class="user-name">{{ currentUserName() }}</span>
        <button type="button" class="logout-btn" title="Sair" (click)="logout()">
          <i class="pi pi-sign-out"></i>
        </button>
      </div>
    </div>
  </aside>

  <main class="shell__content">
    @if (store.lastError()) {
      <div class="shell-alert" role="alert">
        <i class="pi pi-exclamation-triangle shell-alert__icon"></i>
        <div class="shell-alert__body">
          <strong>Operação não concluída</strong>
          <span>{{ store.lastError() }}</span>
        </div>
        <button type="button" class="shell-alert__close" (click)="dismissError()" aria-label="Fechar aviso">
          <i class="pi pi-times"></i>
        </button>
      </div>
    }
    <router-outlet></router-outlet>
  </main>
</div>

<button
  *ngIf="showFab()"
  type="button"
  class="floating-add"
  (click)="showDialog.set(true)"
  aria-label="Adicionar transacao"
>
  <i class="pi pi-plus"></i>
</button>

<app-transaction-dialog
  [visible]="showDialog()"
  [accounts]="store.accounts()"
  [categories]="store.categories()"
  [locale]="store.settings().locale"
  [currency]="store.settings().currency"
  (visibleChange)="showDialog.set($event)"
  (submitted)="onCreateTransaction($event)"
></app-transaction-dialog>
