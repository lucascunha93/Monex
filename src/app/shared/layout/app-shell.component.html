<div class="shell-bg"></div>

<div class="shell">
  <aside class="shell__sidebar">
    <div class="brand">
      <h1>Monex</h1>
      <p>Finance OS</p>
    </div>

    <nav>
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <p-tag [value]="statusLabel()" [severity]="sync.isOnline() ? 'success' : 'warn'"></p-tag>
  </aside>

  <main class="shell__content">
    <router-outlet></router-outlet>
  </main>
</div>

<p-button
  icon="pi pi-plus"
  severity="contrast"
  styleClass="floating-add"
  (onClick)="showDialog.set(true)"
  [rounded]="true"
  [raised]="true"
  ariaLabel="Adicionar transacao"
></p-button>

<app-transaction-dialog
  [visible]="showDialog()"
  [accounts]="store.accounts()"
  [categories]="store.categories()"
  (visibleChange)="showDialog.set($event)"
  (submitted)="onCreateTransaction($event)"
></app-transaction-dialog>
