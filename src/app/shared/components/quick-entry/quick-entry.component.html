<div class="quick-entry">
  <span class="quick-entry__label">
    <i class="pi pi-bolt"></i> Entrada rapida
  </span>
  <div class="quick-entry__row">
    <input
      pInputText
      [ngModel]="inputValue()"
      (ngModelChange)="inputValue.set($event)"
      placeholder="Ex: R$ 50 mercado, +200 salario..."
      aria-label="Entrada rapida de transacao"
      (keydown.enter)="submit()"
    />
    <button type="button" class="quick-btn" (click)="submit()">
      <i class="pi pi-plus"></i>
      <span>Adicionar</span>
    </button>
  </div>
</div>
