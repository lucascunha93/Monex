<p-dialog
  header="Nova transacao"
  [modal]="true"
  [visible]="visible"
  [style]="{ width: '34rem', maxWidth: '96vw' }"
  (visibleChange)="visibleChange.emit($event)"
>
  <!-- Type toggle -->
  <div class="type-toggle">
    <button
      type="button"
      class="type-toggle__btn"
      [class.type-toggle__btn--expense]="model.type === 'expense'"
      [class.active]="model.type === 'expense'"
      (click)="model.type = 'expense'; model.categoryId = 'auto'"
    >
      <i class="pi pi-arrow-up-right"></i> Despesa
    </button>
    <button
      type="button"
      class="type-toggle__btn"
      [class.type-toggle__btn--income]="model.type === 'income'"
      [class.active]="model.type === 'income'"
      (click)="model.type = 'income'; model.categoryId = 'auto'"
    >
      <i class="pi pi-arrow-down-left"></i> Receita
    </button>
  </div>

  <div class="dialog-form">
    <div class="form-field form-field--full">
      <label for="txDescription">Descricao</label>
      <input
        id="txDescription"
        pInputText
        [(ngModel)]="model.description"
        placeholder="Ex: Mercado do mes"
        autocomplete="off"
      />
    </div>

    <div class="form-field">
      <label for="txAmount">Valor</label>
      <p-inputNumber
        inputId="txAmount"
        mode="currency"
        currency="BRL"
        locale="pt-BR"
        [(ngModel)]="model.amount"
      ></p-inputNumber>
    </div>

    <div class="form-field">
      <label for="txDate">Data</label>
      <input
        id="txDate"
        pInputText
        type="date"
        [(ngModel)]="model.date"
      />
    </div>

    <div class="form-field">
      <label for="txCategory">Categoria</label>
      <p-select
        inputId="txCategory"
        [options]="categoryOptions()"
        [(ngModel)]="model.categoryId"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
      ></p-select>
    </div>

    <div class="form-field">
      <label for="txAccount">Conta</label>
      <p-select
        inputId="txAccount"
        [options]="accounts"
        [(ngModel)]="model.accountId"
        optionLabel="name"
        optionValue="id"
        appendTo="body"
      ></p-select>
    </div>

    <div class="form-field form-field--full">
      <label for="txLocation">Local (opcional)</label>
      <input
        id="txLocation"
        pInputText
        [(ngModel)]="model.location"
        placeholder="Ex: Sao Paulo, SP"
      />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="footer-actions">
      <button type="button" class="btn-cancel" (click)="close()">Cancelar</button>
      <button type="button" class="btn-submit" (click)="submit()">
        <i class="pi pi-check"></i> Salvar
      </button>
    </div>
  </ng-template>
</p-dialog>
